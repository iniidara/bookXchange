<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover | BookXchange</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">BookXchange</a>

        <nav>
            <a href="discover.html">Discover</a>
            <a href="near-you.html">Near You</a>
            <a href="shelf.html">My Shelf</a>
        </nav>

        <a href="profile.html" class="profile-link">Profile</a>
    </header>
    <main>

        <section class="page-intro discover-intro">
            <div>
                <p class="eyebrow">Discover</p>
                <h1>Find your next<br>book.</h1>
                <p class="intro-copy">
                    Browse books other readers are willing to exchange.
                </p>
            </div>
        </section>


        <section class="discover-controls">

            <div class="search-wrap">
                <input type="search" id="book-search" placeholder="Search by title or author..." autocomplete="off">
            </div>

            <div class="category-filters">
                <button type="button" class="filter-button active" data-category="all">
                    All
                </button>

                <button type="button" class="filter-button" data-category="fiction">
                    Fiction
                </button>

                <button type="button" class="filter-button" data-category="non-fiction">
                    Non-fiction
                </button>

                <button type="button" class="filter-button" data-category="classics">
                    Classics
                </button>

                <button type="button" class="filter-button" data-category="poetry">
                    Poetry
                </button>
            </div>

        </section>


        <section class="discover-section">

            <div class="section-heading">
                <div>
                    <p class="eyebrow">Books for you</p>
                    <h2>What readers are sharing.</h2>
                </div>

                <span id="discover-count">0 books</span>
            </div>

            <div class="discover-grid" id="discover-book-list"></div>

        </section>

    </main>


    <footer>
        <p>BookXchange</p>
        <p>Books finding new readers.</p>
    </footer>


    <script src="js/app.js"></script>

</body>

</html>
