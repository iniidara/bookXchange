<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shelf | BookXchange</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">BookXchange</a>

        <nav>
            <a href="discover.html">Discover</a>
            <a href="near-you.html">Near You</a>
            <a href="shelf.html">My Shelf</a>
        </nav>

        <a href="profile.html" class="profile-link">Profile</a>
    </header>


    <main>

        <section class="page-intro shelf-intro">

            <div>
                <p class="eyebrow">My Shelf</p>

                <h1>The books<br>I have.</h1>
            </div>

            <button type="button" class="button primary" id="add-book-button">
                + Add a book
            </button>

        </section>

        <section class="add-book-section" id="add-book-section">

            <div class="add-book-panel">

                <button type="button" class="close-add-book" id="close-add-book" aria-label="Close">
                    ×
                </button>

                <div class="shelf-heading">
                    <div>
                        <p class="eyebrow">Add to your shelf</p>
                        <h2>Give a book a new reader.</h2>
                    </div>
                </div>

                <form id="add-book-form">

                    <label for="book-title">Title</label>
                    <input type="text" id="book-title" placeholder="e.g. Half of a Yellow Sun" required>

                    <label for="book-author">Author</label>
                    <input type="text" id="book-author" placeholder="e.g. Chimamanda Ngozi Adichie" required>

                    <label for="book-image">Photo of your book</label>
                    <input type="file" id="book-image" accept="image/*">

                    <label for="book-condition">Condition</label>
                    <select id="book-condition" required>
                        <option value="">Choose condition</option>
                        <option value="Like New">Like New</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                    </select>

                    <label for="book-description">Description</label>
                    <textarea id="book-description"
                        placeholder="Tell another reader anything they should know about the book."></textarea>

                    <button type="submit" class="button primary" id="book-form-submit">
                        Add book
                    </button>

                </form>

            </div>

        </section>


        <section class="shelf-section">

            <div class="shelf-heading">

                <div>
                    <p class="eyebrow">Available for exchange</p>
                    <h2>Books I'm willing to let go.</h2>
                </div>

                <span id="book-count">0 books</span>

            </div>


            <div class="shelf-grid" id="book-list"></div>

        </section>


        <section class="shelf-section secondary-shelf">

            <div class="shelf-heading">

                <div>
                    <p class="eyebrow">My library</p>
                    <h2>Books I'm keeping.</h2>
                </div>

                <span id="library-count">0 books</span>

            </div>

            <div class="library-list" id="library-list"></div>

        </section>

    </main>


    <footer>
        <p>BookXchange</p>
        <p>Books finding new readers.</p>
    </footer>


    <script src="js/app.js"></script>

</body>

</html>
