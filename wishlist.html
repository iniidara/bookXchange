<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | BookXchange</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">

        <a href="index.html" class="site-logo">
            BookXchange
        </a>

        <nav class="site-nav">
            <a href="discover.html">Discover</a>
            <a href="near-you.html">Near You</a>
            <a href="shelf.html">My Shelf</a>
            <a href="profile.html">Profile</a>
        </nav>

    </header>


    <main>

        <section class="page-intro">
            <p class="eyebrow">Wishlist</p>

            <h1>The books<br>I want.</h1>

            <p>
                Keep track of the books you're hoping to find.
                Someone out there might have one.
            </p>
        </section>


        <section class="wishlist-section">

            <div class="wishlist-heading">
                <div>
                    <p class="eyebrow">Looking for</p>
                    <h2>Books on my mind.</h2>
                </div>

                <button type="button" class="button primary" id="add-wishlist-button">
                    + Add a book
                </button>
            </div>


            <div class="wishlist-list" id="wishlist-list">





            </div>

        </section>

        <section class="wishlist-modal" id="wishlist-modal" aria-hidden="true">
            <div class="wishlist-overlay"></div>

            <div class="wishlist-panel">

                <button type="button" class="close-wishlist" id="close-wishlist" aria-label="Close">
                    ×
                </button>

                <p class="eyebrow">Wishlist</p>

                <h2>Add a book you're looking for.</h2>

                <form id="wishlist-form">

                    <label for="wishlist-title">
                        Title
                    </label>

                    <input type="text" id="wishlist-title" placeholder="e.g. The Secret History" required>

                    <label for="wishlist-author">
                        Author
                    </label>

                    <input type="text" id="wishlist-author" placeholder="e.g. Donna Tartt" required>

                    <label for="wishlist-note">
                        Why do you want it?
                    </label>

                    <textarea id="wishlist-note"
                        placeholder="Tell another reader why you're looking for it."></textarea>

                    <button type="submit" class="button primary">
                        Add to wishlist
                    </button>

                </form>

            </div>
        </section>

    </main>


    <footer>
        <p>BookXchange</p>
        <p>Books finding new readers.</p>
    </footer>


    <script src="js/app.js"></script>

</body>

</html>
